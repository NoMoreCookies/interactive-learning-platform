    <g fill="#60A5FA">
      <circle cx="26" cy="58" r="2"/>
      <circle cx="38" cy="42" r="2"/>
      <circle cx="118" cy="36" r="2"/>
      <circle cx="132" cy="52" r="2"/>
      <circle cx="28" cy="102" r="2"/>
      <circle cx="124" cy="96" r="2"/>
      <circle cx="48" cy="128" r="2"/>
